<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>宮崎 真之介 — ソフトウェアエンジニア</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;600&family=Klee+One:wght@400;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
<style>
  :root {
    --jp: "Zen Kaku Gothic New", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    --jp-soft: "Klee One", "Zen Kaku Gothic New", serif;
    --serif: "DM Serif Display", "Hiragino Mincho ProN", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--jp);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    line-height: 1.6;
  }

  .page {
    min-height: 100vh;
    position: relative;
    transition: background 0.5s ease, color 0.5s ease;
  }

  /* themes */
  .page.theme-cream {
    --bg: #f6f1e8;
    --surface: #fbf7ef;
    --surface-2: #efe8d9;
    --fg: #3d342a;
    --fg-2: #6a5c4d;
    --fg-3: #a08f7c;
    --line: #e6dccb;
    --line-soft: #efe8d9;
    background: var(--bg);
    color: var(--fg);
  }
  .page.theme-night {
    --bg: #2a2620;
    --surface: #322d26;
    --surface-2: #3a342c;
    --fg: #f0e9dc;
    --fg-2: #c7bda9;
    --fg-3: #8c8270;
    --line: #45402f33;
    --line-soft: #3a342c;
    background: var(--bg);
    color: var(--fg);
  }
  .page.theme-night .bg-blob { opacity: 0.18; }

  /* accents */
  .page.accent-sage  { --accent: #8aa68a; --accent-soft: #c6d6c6; }
  .page.accent-peach { --accent: #d8a48a; --accent-soft: #ecd2c4; }
  .page.accent-sky   { --accent: #8aaac0; --accent-soft: #c6d8e3; }
  .page.accent-rose  { --accent: #c89aa0; --accent-soft: #e3c8cc; }

  /* soft background blobs */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.55;
    transition: background 0.5s ease;
  }
  .bg-blob-1 {
    width: 420px; height: 420px;
    background: var(--accent-soft);
    top: -120px; right: -120px;
  }
  .bg-blob-2 {
    width: 340px; height: 340px;
    background: var(--accent-soft);
    bottom: 10%; left: -140px;
    opacity: 0.4;
  }

  /* TOPBAR */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    background: color-mix(in oklab, var(--bg) 75%, transparent);
  }
  .topbar-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px;
    color: var(--fg);
    font-weight: 500;
  }
  .brand-mark { color: var(--accent); display: inline-flex; }
  .brand-name { letter-spacing: 0.04em; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .clock {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px;
    color: var(--fg-2);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    font-variant-numeric: tabular-nums;
  }
  .clock-loc { color: var(--fg-3); font-size: 11px; }
  .clock-time { font-weight: 500; color: var(--fg); }
  .theme-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: grid; place-items: center;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .theme-btn:hover { background: var(--surface-2); transform: rotate(-12deg); }

  /* COLUMN */
  .col {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 80px;
    position: relative;
    z-index: 2;
  }

  /* HERO */
  .hero {
    padding-bottom: var(--gap-y);
  }
  .hero-greet {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--jp-soft);
    font-size: 14px;
    color: var(--fg-2);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 8px 16px 8px 14px;
    border-radius: 999px;
  }
  .hero-greet-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 55%, transparent);
    animation: gpulse 2.4s infinite ease-out;
  }
  @keyframes gpulse {
    0%   { box-shadow: 0 0 0 0  color-mix(in oklab, var(--accent) 50%, transparent); }
    70%  { box-shadow: 0 0 0 10px color-mix(in oklab, var(--accent) 0%, transparent); }
    100% { box-shadow: 0 0 0 0  color-mix(in oklab, var(--accent) 0%, transparent); }
  }
  .hero-name {
    margin: 32px 0 8px;
    font-family: var(--jp);
    font-weight: 500;
    font-size: clamp(40px, 8vw, 64px);
    line-height: 1.15;
    letter-spacing: 0.02em;
    color: var(--fg);
  }
  .hero-name-given {
    color: var(--accent);
    margin-left: 0.05em;
  }
  .hero-name-en {
    display: block;
    margin-top: 10px;
    font-family: var(--serif);
    font-size: clamp(16px, 2.4vw, 22px);
    color: var(--fg-3);
    letter-spacing: 0.02em;
    font-weight: 400;
  }
  .hero-role {
    margin: 0 0 16px;
    font-size: 16px;
    color: var(--fg-2);
    font-family: var(--jp-soft);
  }
  .hero-tags {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 28px;
  }
  .pill {
    display: inline-flex; align-items: center;
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
    color: var(--fg);
    font-weight: 400;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .pill:hover {
    background: var(--accent-soft);
    border-color: color-mix(in oklab, var(--accent) 50%, transparent);
    transform: translateY(-1px);
  }
  .hero-bio {
    font-size: 15.5px;
    line-height: 1.95;
    color: var(--fg-2);
    margin: 0 0 32px;
    text-wrap: pretty;
  }
  .hero-meta {
    display: flex; flex-direction: column;
    gap: 2px;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
  }
  .meta-row {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 16px;
    align-items: center;
    padding: 6px 0;
    font-size: 14px;
  }
  .meta-row + .meta-row {
    border-top: 1px solid var(--line-soft);
  }
  .meta-key {
    color: var(--fg-3);
    font-family: var(--jp-soft);
    font-size: 13px;
  }
  .meta-val { color: var(--fg); }

  /* SECTION */
  .sec { padding: var(--gap-y) 0; }
  .sec-head {
    display: flex; align-items: baseline; gap: 14px;
    margin-bottom: 32px;
  }
  .sec-head h2 {
    margin: 0;
    font-family: var(--jp);
    font-weight: 500;
    font-size: 26px;
    color: var(--fg);
    letter-spacing: 0.04em;
  }
  .sec-sub {
    font-family: var(--serif);
    font-size: 16px;
    color: var(--fg-3);
    font-weight: 400;
  }

  /* SKILLS */
  .skills { display: flex; flex-direction: column; gap: 32px; }
  .skill-group-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 14px;
  }
  .skill-group h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
    color: var(--fg);
  }
  .skill-group-note {
    font-family: var(--jp-soft);
    font-size: 13px;
    color: var(--fg-3);
  }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }

  /* PROJECTS EMPTY */
  .empty-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 40px 28px 36px;
    text-align: center;
    color: var(--accent);
  }
  .empty-illust { margin-bottom: 4px; opacity: 0.9; }
  .empty-title {
    font-family: var(--jp-soft);
    font-size: 18px;
    color: var(--fg);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .empty-sub {
    font-size: 14px;
    color: var(--fg-2);
    line-height: 1.9;
    margin-bottom: 20px;
  }
  .empty-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-size: 14px;
    white-space: nowrap;
    transition: transform 0.2s ease, filter 0.2s ease;
  }
  .page.theme-night .empty-link { color: #2a2620; }
  .empty-link:hover {
    transform: translateY(-1px);
    filter: brightness(1.05);
  }
  .empty-link span { transition: transform 0.2s ease; }
  .empty-link:hover span { transform: translateX(3px); }

  /* LINKS */
  .links {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .link-card {
    display: block;
    padding: 18px 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    text-decoration: none;
    color: var(--fg);
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }
  .link-card:hover {
    background: var(--surface-2);
    border-color: color-mix(in oklab, var(--accent) 45%, var(--line));
    transform: translateY(-2px);
  }
  .link-card-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px;
  }
  .link-card-label {
    font-size: 13px;
    color: var(--fg-3);
    font-family: var(--jp-soft);
    white-space: nowrap;
  }
  .link-card-arrow {
    color: var(--accent);
    font-size: 16px;
    flex-shrink: 0;
    transition: transform 0.25s ease;
  }
  .link-card:hover .link-card-arrow { transform: translate(3px, -1px); }
  .link-card-value {
    font-size: 16px;
    color: var(--fg);
    font-weight: 500;
  }
  .link-card-note {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--fg-3);
    font-family: var(--jp-soft);
  }

  /* FOOTER */
  .foot {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--line-soft);
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    font-size: 12px;
    color: var(--fg-3);
  }
  .foot-sub { font-family: var(--jp-soft); }

  @media (max-width: 520px) {
    .col { padding: 48px 18px 64px; }
    .topbar-inner { padding: 12px 18px; }
    .hero-name { font-size: 36px; }
    .meta-row { grid-template-columns: 60px 1fr; gap: 12px; }
    .empty-card { padding: 32px 20px 28px; }
    .link-card { padding: 16px 18px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="portfolio.jsx"></script>
</body>
</html>
